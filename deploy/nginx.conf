# Ponto único de entrada do sistema (porta 80 do contêiner "web").
#
# O DNS interno do Docker devolve o IP de TODAS as réplicas de "auth" e "chat";
# o Nginx distribui as requisições entre elas.
#   - auth: round-robin (requisições curtas e sem estado)
#   - chat: least_conn, pois conexões WebSocket são longas e o round-robin
#           desequilibraria a carga ao longo do tempo
# Se uma réplica falhar, max_fails/fail_timeout a retiram temporariamente e
# proxy_next_upstream reenvia a requisição para outra réplica.
# Após escalar (docker compose up --scale chat=N), reinicie o "web" para recarregar a lista.

upstream auth_servico {
    server auth:8000 max_fails=2 fail_timeout=10s;
}

upstream chat_servico {
    least_conn;
    server chat:8000 max_fails=2 fail_timeout=10s;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    client_max_body_size 1m;

    # Mostra qual réplica respondeu (útil nos testes de balanceamento)
    add_header X-Upstream $upstream_addr always;

    location /api/auth/ {
        proxy_pass http://auth_servico;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_next_upstream error timeout http_502 http_503;
    }

    location /api/chat/ {
        proxy_pass http://chat_servico;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_next_upstream error timeout http_502 http_503;
    }

    location /ws/chat/ {
        proxy_pass http://chat_servico;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # SPA React: rotas desconhecidas voltam para o index.html
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
